# Research pack: competitor weakness map
# Each pack is one PMM question with a fixed recipe, so every run is comparable.
name: weakness_map
version: 2
question: Where is each competitor losing users?
deliverable: battlecard

# Which reviews this pack reads.
ratings: [1, 2, 3]

# Sample-size rules, per app, counted on the reviews this pack reads:
#   fewer than min_reviews  -> no themes at all, the reviews are just listed (and not labelled)
#   fewer than min_sample   -> counts only ("4 of 17"), marked as directional
#   min_sample or more      -> full percentages
min_reviews: 10
min_sample: 30

# Fixed theme list. Every review gets exactly one primary theme from this list,
# which is what lets results add up and compare across apps and across runs.
themes:
  pricing_paywall: Price, subscription, paywall, free-tier limits, feeling charged unfairly
  ads: Too many ads or intrusive ads
  bugs_crashes: Crashes, freezes, features that do not work
  performance: Slow, laggy, battery or storage drain
  update_regression: A recent update removed something or made the app worse
  missing_feature: A feature the user wants that the app does not have
  onboarding_setup: Hard to get started, sign up, import data, or reach first value
  ux_confusing: Confusing navigation or design, hard to find things
  account_login: Login, password, verification or account access problems
  sync_data_loss: Lost data, sync failures, backup problems
  customer_support: Support is slow, unhelpful or unreachable
  privacy_trust: Privacy worries, permissions, feels like a scam
  content_quality: The content or core output of the app is poor
  other: Does not fit any theme above

# Keyword rules for the free labeller (--tagger keywords). A review gets the theme
# with the most keyword matches; ties go to the theme listed first; no match is "other".
# A keyword matches from the start of a word, so "crash" also matches "crashes".
# Version 2 added words found in reviews that matched no theme in the Apple Music study (#7),
# including the common misspelling "adds" for ads.
keywords:
  pricing_paywall: [subscription, subscribe, paywall, premium, price, pricing, expensive, cost, charge, refund, money, purchase, free trial, billing, pay for, have to pay, paid, membership, prime, family plan, student plan, duo, limit, skips]
  ads: [ads, advert, sponsored, commercials, adds, ad free, ad-free, commercial]
  bugs_crashes: [crash, bug, glitch, freez, froze, broken, doesn't work, doesnt work, not working, won't load, wont load, won't open, wont open, error, stopped working, black screen, keeps closing, stops playing, stop playing, playback, won't play, wont play, stuck, blank]
  performance: [slow, lag, battery, storage, takes forever, loading forever, drain, overheat]
  update_regression: [update, new version, old version, used to, bring back, removed, redesign, ever since, go back to, change it back, logo, icon, new ui, new look, new design]
  missing_feature: [wish, should add, please add, need to add, no option, missing, lacks, would be nice, there's no way, theres no way, let us, allow us, sleep timer, lyrics, widget, multi select, multi-select, needs a, option]
  onboarding_setup: [sign up, signup, set up, setup, verification code, tutorial, getting started, create an account, register]
  ux_confusing: [confusing, hard to use, complicated, hard to find, interface, layout, navigate, cluttered, unintuitive]
  account_login: [log in, login, logged out, logged me out, password, banned, ban, suspended, locked out, hacked, disabled, my account]
  sync_data_loss: [lost, deleted, disappeared, sync, backup, erased, streak, all my, download, offline]
  customer_support: [support, customer service, no response, no reply, contact, help center, appeal]
  privacy_trust: [privacy, tracking, scam, creepy, location, permission, spy, unsafe, predator, inappropriate, my data]
  content_quality: [boring, algorithm, feed, reels, spam, bots, fake, irrelevant, suggested posts, content, recommend, personaliz, repeat, same song, same music, sound quality, audio, volume, dolby]
