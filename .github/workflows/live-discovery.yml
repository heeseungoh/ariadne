# Runs competitor discovery against the real App Store and posts the result on the
# pull request, so changes to discovery are judged on real output, not only on fixtures.
name: live-discovery

on:
  pull_request:
    paths:
      - "ariadne_pmm/ingest/discover.py"
      - "ariadne_pmm/ingest/app_store.py"
      - "ariadne_pmm/cli.py"
      - "case-studies/*/args.txt"
      - ".github/workflows/live-discovery.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Discover competitors for BeReal
        run: |
          {
            echo "### Live discovery: BeReal"
            echo '```'
            ariadne-pmm discover "BeReal" --keyword "photo sharing" --keyword "friends" --top 10 2>&1
            echo '```'
            echo "### Live review feed and sample check: BeReal and its top 5 (first 2 pages each)"
            echo '```'
            ariadne-pmm fetch --seed "BeReal" --keyword "photo sharing" --keyword "friends" --top 5 --pages 2 2>&1 | grep -E "pulled|Sample check|reviews:"
            echo '```'
            # Each case study's own settings, with a longer list so near-misses are visible
            for args in case-studies/*/args.txt; do
              [ -f "$args" ] || continue
              study=$(basename "$(dirname "$args")")
              echo "### Live discovery: $study (study settings, top 15)"
              echo '```'
              sed -e 's/--seed //' -e 's/--top [0-9]*//' "$args" | xargs ariadne-pmm discover --top 15 2>&1 | cut -c1-220
              echo '```'
            done
          } > discovery.md
          cat discovery.md
      - name: Post result on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file discovery.md
