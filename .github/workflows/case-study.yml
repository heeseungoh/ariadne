# Runs the BeReal case study and commits the report to the pull request branch.
# Needs a repository secret named ANTHROPIC_API_KEY. Labelling costs API credits,
# so this only runs for branches of this repository, never for forks.
name: case-study

on:
  pull_request:
    paths:
      - "case-studies/bereal/study.md"
      - ".github/workflows/case-study.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  bereal:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Check for the API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "The case study did not run: add a repository secret named \`ANTHROPIC_API_KEY\` (Settings > Secrets and variables > Actions), then re-run this job."
            exit 1
          fi
      - name: Run the weakness map on BeReal and its top 5 competitors
        run: |
          ariadne-pmm run weakness_map --seed "BeReal" --keyword "photo sharing" --keyword "friends" \
            --top 5 --out case-studies/bereal 2>&1 | tee run.log
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-studies/bereal/*.md
          git commit -m "docs: add bereal weakness map report"
          git push origin "HEAD:$HEAD_REF"
      - name: Post the run log on the pull request
        if: always()
        run: |
          if [ -f run.log ]; then
            { echo "### Case study run"; echo '```'; tail -n 30 run.log; echo '```'; } > comment.md
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi
