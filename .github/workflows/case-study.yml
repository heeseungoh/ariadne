# Runs every case study this pull request touches and commits the reports to its branch.
# A study re-runs only when its args.txt changed after its latest report, or it has no report.
# A study is a folder in case-studies/ with an args.txt holding the options for
# `ariadne-pmm run weakness_map`. Uses the free keyword labeller: no API key, no cost.
# It writes to the branch, so it only runs for branches of this repository, never for forks.
name: case-study

on:
  pull_request:
    paths:
      - "case-studies/*/args.txt"
      - "case-studies/*/study.md"
      - ".github/workflows/case-study.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run the studies changed in this pull request
        run: |
          set -o pipefail
          studies=$(git diff --name-only "origin/$BASE_REF...HEAD" -- case-studies | cut -d/ -f2 | sort -u)
          for study in $studies; do
            [ -f "case-studies/$study/args.txt" ] || continue
            # Re-run only when the settings changed after the latest report, so editing a
            # study's write-up never moves its numbers. Delete the report to force a re-run.
            if ls "case-studies/$study"/weakness_map-*.md >/dev/null 2>&1; then
              args_commit=$(git log -1 --format=%H -- "case-studies/$study/args.txt")
              report_commit=$(git log -1 --format=%H -- "case-studies/$study/weakness_map-*.md")
              if git merge-base --is-ancestor "$args_commit" "$report_commit"; then
                echo "== $study: settings unchanged since the last report, skipped" | tee -a run.log
                continue
              fi
            fi
            echo "== $study" | tee -a run.log
            xargs ariadne-pmm run weakness_map --tagger keywords --out "case-studies/$study" \
              < "case-studies/$study/args.txt" 2>&1 | tee -a run.log
          done
      - name: Commit the reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-studies/*/*.md
          git diff --cached --quiet || git commit -m "docs: update case study reports"
          git push origin "HEAD:$HEAD_REF"
      - name: Post the run log on the pull request
        if: always()
        run: |
          if [ -f run.log ]; then
            { echo "### Case study run"; echo '```'; tail -n 40 run.log; echo '```'; } > comment.md
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi
