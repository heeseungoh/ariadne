[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "positioning-lab"
version = "0.1.0"
description = "Turn customer reviews into defensible product positioning."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
positioning-lab = "positioning_lab.cli:main"

[tool.setuptools.packages.find]
include = ["positioning_lab*"]

[tool.setuptools.package-data]
positioning_lab = ["packs/*.yaml"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
