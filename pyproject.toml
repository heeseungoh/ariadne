[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne-pmm"
version = "0.1.0"
description = "Ariadne: turn customer reviews into product positioning you can defend."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ariadne-pmm = "ariadne_pmm.cli:main"

[tool.setuptools.packages.find]
include = ["ariadne_pmm*"]

[tool.setuptools.package-data]
ariadne_pmm = ["packs/*.yaml"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
